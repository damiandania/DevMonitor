name: DevMonitor
options:
  bundleIdPrefix: app.devmonitor
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
# CODE_SIGN_IDENTITY comes from tools/Signing.xcconfig (default ad-hoc "-"), which optionally pulls in a
# git-ignored per-machine override so local builds sign with the stable self-signed cert — see that file
# and tools/ensure-signing-cert.sh. It lives in an xcconfig, NOT in `settings` here, because a value in
# `settings` lands in the pbxproj and would override the xcconfig.
configFiles:
  Debug: tools/Signing.xcconfig
  Release: tools/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  DevMonitor:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - DevMonitor
    # Build the CLI first (link:false — it's an executable, not something we link against) and drop it
    # inside the app bundle (Contents/MacOS/dev-monitor). The "Install CLI" button in Settings then
    # symlinks ~/.local/bin/dev-monitor at it, so the CLI always matches the running app (they share
    # IPCProtocol — a stale CLI would mis-decode `status`). Copy runs post-sign, so the nested binary
    # is ad-hoc like the app; a notarized release would need to re-sign it (see package-release.sh).
    dependencies:
      - target: dev-monitor
        link: false
    postBuildScripts:
      - name: Embed dev-monitor CLI into the app bundle
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cp -f "$BUILT_PRODUCTS_DIR/dev-monitor" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/dev-monitor"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.devmonitor.app
        PRODUCT_NAME: "Dev Monitor"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: DevMonitor/Resources/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: DevMonitor/Sys/DevMonitor-Bridging-Header.h
      configs:
        # Hardened runtime + entitlements only on Release — that's what notarization requires. Debug
        # (and the test harness, which builds Debug) stay ad-hoc with no runtime, so they're untouched.
        # package-release.sh re-signs the Release build with a Developer ID when DEVELOPER_ID is set.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: DevMonitor/Resources/DevMonitor.entitlements
  dev-monitor:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - dev-monitor
      - path: DevMonitor/Model/IPCProtocol.swift
      - path: DevMonitor/Sys/ipc.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.devmonitor.cli
        PRODUCT_NAME: "dev-monitor"
        SWIFT_OBJC_BRIDGING_HEADER: dev-monitor/Bridging.h
schemes:
  DevMonitor:
    build:
      targets:
        DevMonitor: all
    run:
      config: Debug
  dev-monitor:
    build:
      targets:
        dev-monitor: all
    run:
      config: Debug
